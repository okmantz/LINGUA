name: CI
# Type-checks, runs tests, and verifies the committed GitHub Pages build in docs/ is complete
# (catches partial uploads that leave the site blank with "The app failed to load").
on:
  push:
    branches: [main]
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:docs

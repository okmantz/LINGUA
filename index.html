<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="LINGUA" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>LINGUA — Language Acquisition</title>
</head>
<body>
  <div id="root"></div>
  <!-- Load-failure guard: plain script (runs even when the app bundle cannot load). -->
  <script>
    setTimeout(function () {
      var r = document.getElementById('root');
      if (r && r.childElementCount === 0) {
        var m = location.protocol === 'file:'
          ? 'This page was opened from a file, and browsers block the app\'s scripts that way. Open <b>lingua.html</b> (the single-file build) instead, or run <code>npm run preview</code>.'
          : 'The app failed to load. If this is GitHub Pages: Settings → Pages → Source must be <b>Deploy from a branch</b> → <b>main</b> → <b>/docs</b>. Otherwise hard-refresh (Ctrl/Cmd+Shift+R).';
        r.innerHTML = '<div style="font:16px system-ui;max-width:34rem;margin:15vh auto;padding:1rem;color:#e2e8f0;background:#0f172a;border-radius:12px">' + m + '</div>';
      }
    }, 4000);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

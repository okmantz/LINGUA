## pronouns | pronouns | Subject pronouns & "you" | A1
S: Spanish has two ways to say "you" — and the verb ending usually shows who is acting, so pronouns are often dropped.
B: The pronouns are **yo, tú, él/ella/usted, nosotros/as, vosotros/as, ellos/ellas/ustedes**. Use **tú** with friends, family and peers; use **usted** with strangers, elders and in formal situations.
B: Latin America uses **ustedes** for every plural "you". Spain adds **vosotros/as** for informal plural. This course teaches ustedes first and shows vosotros as a recognition form.
B: Because endings carry the subject (hablo = I speak), say the pronoun only to contrast or emphasise: "Yo trabajo, pero él no."

## articles-gender | articles-gender | Gender, articles & plurals | A1
S: Every noun is masculine or feminine; the article (el/la, un/una) must match, and plurals add -s or -es.
B: Most nouns ending in **-o** are masculine (el libro) and most ending in **-a** are feminine (la casa). Learn nouns **with their article** — "el", "la" — from day one.

B: Plurals: vowel → add **-s** (casa → casas); consonant → add **-es** (ciudad → ciudades); -z → -ces (lápiz → lápices). Definite plural: los/las; indefinite: unos/unas.

## modals | modals | Can, must, need: verb + infinitive | A2

M: "Hay que" doesn't change: Hay que estudiar.

## subjunctive | subjunctive | Present subjunctive: wishes, doubts, emotions | B1
S: The subjunctive expresses wishes, doubts, emotions and non-facts after que.
B: Formation: take the **yo present**, drop -o, add the "opposite" vowel: hablo → **hable, hables, hable, hablemos, hablen**; como → **coma…**; hago → **haga…**. Irregular: **ser** (sea), **ir** (vaya), **estar** (esté), **saber** (sepa), **dar** (dé).
B: Triggers (WEIRDO): **W**ishes (quiero que), **E**motions (me alegro de que), **I**mpersonal (es importante que), **R**ecommendation (recomiendo que), **D**oubt (dudo que), **O**jalá. Needs a change of subject: Quiero que **vengas** (but: Quiero venir).
E: Quiero que vengas mañana. = I want you to come tomorrow.

E: Dudo que sea verdad. = I doubt that it's true.

M: Using the subjunctive after "creo que" (affirmative) — indicative: Creo que es verdad. But No creo que sea verdad.
M: Wrong vowel — hable (not "habla") for -ar.

## sounds | sounds | Spanish vowels & the alphabet | A1
I: Spanish has only five pure vowel sounds, and they never glide like English vowels. Spelling is almost perfectly phonetic: once you know the rules you can read any word aloud.
S: a | Like "a" in father; short and open | casa=house, mano=hand
S: e | Like "e" in bed, not "ay" | mesa=table, tres=three
S: i | Like "ee" in see, but shorter | sí=yes, libro=book
S: o | Like "o" in more, without the "w" glide | no=no, hola=hello
S: u | Like "oo" in moon; silent in que/qui/gue/gui | uno=one, que=that
S: h | Always silent | hola=hello, hotel=hotel
S: j / g(e,i) | A throaty "h", like Scottish loch | jugar=to play, gente=people
S: ñ | Like "ny" in canyon | año=year, español=Spanish
S: ll / y | Like English "y" in yes (some regions "j") | llamo=I call, yo=I
P: casa | caza | s vs z are the same sound in Latin America, different in Spain (th)
P: pero | perro | single r is a tap; rr is a trill — meaning changes
P: pena | peña | n vs ñ
D: La casa de mi hermana es muy bonita.
D: Mucho gusto, me llamo Ana.
D: ¿Dónde está el hotel?
M: Pronouncing the h (hola ≠ "hola" with breath) — it's silent.
M: Diphthonging vowels like English ("no" as "noh-oo").
M: Aspirating p, t, k like English — Spanish ones are unaspirated and softer.
## sounds2 | sounds2 | Stress, r/rr & b/v | A1
I: Spanish stress is predictable: words ending in a vowel, n or s are stressed on the second-to-last syllable; others on the last. A written accent marks every exception.
S: stress rule | Ends in vowel/n/s → second-to-last syllable (HAB-la). Ends in other consonant → last (ha-BLAR). Accent mark = exception (can-CIÓN). | hablo, hablar, canción
S: r | One light tap, like "tt" in butter, between vowels and in the middle (pero) | pero=but, hora=hour
S: rr / initial r | A trill; tongue vibrates against the ridge behind the teeth | perro=dog, rápido=fast
S: b / v | Identical sounds. Hard b at the start or after a pause; soft (lips barely touch) between vowels | vaso=glass, lavar=to wash
S: d (between vowels) | Soft, like "th" in "this" | todo=all, cada=each
P: pero | perro | but / dog
P: caro | carro | expensive / car
P: hablo | habló | I speak / he spoke (stress)
D: El perro rápido corre por la calle.
D: Quiero un café con leche, por favor.
D: Mi abuelo vive en Valencia.
M: Putting stress on the wrong syllable — it changes meaning (papa potato vs papá dad).
M: Using an English r.
M: Pronouncing b and v differently.

## passive | passive | Passive & on | B2
S: French avoids the passive in speech — use on, or a reflexive verb, instead.
B: **True passive**: être + past participle (agreeing) + par: La lettre est écrite par Marie. Common in news and formal writing. **On** replaces an unknown agent: On parle français ici. **Reflexive passive**: Ça se dit comme ça. Les livres se vendent bien.
B: Only direct-object verbs can become passive: "Il a été donné un cadeau" is not French — use On lui a donné un cadeau.
E: Ici, on parle français. = French is spoken here.
E: Les livres se vendent bien. = The books sell well.
E: La lettre a été écrite par Marie. = The letter was written by Marie.
E: On m'a volé mon sac. = My bag was stolen.
M: Overusing être + participle in conversation — on is more natural.
M: Forgetting agreement: "La lettre est écrit" → écrite.
M: Passivising indirect objects (as in English "I was given a gift") — not possible.

## sounds | sounds | French vowels, nasals & silent letters | A1
I: French spelling is irregular but rule-bound: most final consonants are silent, vowels are pure and tense, and nasal vowels (an, on, in) have no "n" sound. Stress is even, with a slight lift on the last syllable of a phrase.
S: u | Say "ee" with your lips rounded like "oo" | tu=you, rue=street
S: ou | Like "oo" in food | vous=you, jour=day
S: eu / œu | Like "uh" with rounded lips | deux=two, sœur=sister
S: nasals (an/en) | "ahn" through the nose; don't pronounce the n | enfant=child, dans=in
S: nasals (on) | "ohn" through the nose | bon=good, nous=we
S: nasals (in/ain) | "an" as in "can", through the nose | vin=wine, pain=bread
S: r | Back-of-throat "r", like a soft gargle | rouge=red, merci=thanks
S: silent letters | Final -s, -t, -d, -x, -z, -e, and -ent in verbs are mute | petit, trois, parlent
S: ch / j / g(e,i) | ch = "sh"; j and soft g = "zh" (like "measure") | chat=cat, jour=day
P: tu | tout | ü vs oo
P: rue | roue | street / wheel
P: bon | beau | nasal vs oh
D: Bonjour, je m'appelle Ana et j'habite à Paris.
D: Tu as deux sœurs et un frère ?
D: Un bon vin blanc, s'il vous plaît.
M: Pronouncing the final consonant (petit → "peh-teet").
M: Saying the nasal "n" (bon → "bon" with n).
M: Replacing u with oo (tu ≠ tout).
## sounds2 | sounds2 | Liaison, elision & rhythm | A1
I: French flows: words link together. Elision drops a vowel before another vowel (l'ami, j'aime), and liaison pronounces a normally silent final consonant before a vowel (les amis → lay-za-MEE).
S: elision | le/la/je/de/ne/que → l'/j'/d'/n'/qu' before a vowel or silent h | l'école, j'aime, n'est
S: liaison (required) | Article + noun, pronoun + verb, adjective + noun | les amis, nous avons, un petit ami
S: liaison (forbidden) | After "et", before an h aspiré | et un, les héros
S: enchaînement | A final pronounced consonant moves to the next vowel | il est → i-LEH, elle a → eh-LAH
S: stress | Even rhythm; slightly longer on the final syllable of a group | je m'appelle ANA
S: é / è / ê | é = "ay" (closed); è ê = "eh" (open) | café, mère, fête
P: les amis | les mis | liaison turns "les" into "lez"
P: il est | il a | il-EH vs il-AH
P: dessus | dessous | on top / underneath
D: Nous avons un petit appartement à Lyon.
D: Les enfants ont envie d'un gâteau.
D: Elle est ici, il est là.
M: Stressing a syllable in the middle like English — French is evenly timed.
M: Forgetting liaison in "vous êtes", "ils ont".
M: Adding liaison after "et".

## pronouns | pronouns | Subject pronouns, du vs Sie | A1
S: German has an informal du and a formal Sie — and Sie is always capitalised.
B: **ich, du, er/sie/es, wir, ihr, sie / Sie**. Use **du** with friends, family, children and peers; **Sie** (capital S) with strangers, at work, in shops. **ihr** is the informal plural; **Sie** is both formal singular and plural.
B: **sie** (she), **sie** (they) and **Sie** (formal you) look alike — the verb and context tell them apart: sie ist (she is), sie sind (they are), Sie sind (you are, formal).

## articles-gender | articles-gender | Gender, articles & plurals | A1
S: Every noun is der, die or das — learn each noun with its article and its plural.
B: **der** (masculine), **die** (feminine), **das** (neuter); plural **die**. Indefinite: **ein / eine / ein** (no plural). Every noun is **capitalised**: der Tisch, die Stadt.
B: Gender is largely arbitrary, but clues help: **-ung, -heit, -keit, -schaft, -tion → die**; **-er, -ling, -ismus → der**; **-chen, -lein → das**. Plurals vary: **-e** (Tisch → Tische), **-er** (Kind → Kinder), **-n/-en** (Frau → Frauen), **-s** (Auto → Autos), **umlaut** (Mutter → Mütter), or no change (Lehrer).
B: In the **accusative** (direct object) only masculine changes: der → **den**, ein → **einen**: Ich sehe den Mann.

B: **Vorgangspassiv**: **wird/werden + Partizip II**: Das Haus **wird gebaut**. The agent appears with **von** (+ dative): Das Haus wird **von** den Arbeitern gebaut. Past: **wurde/wurden + Partizip II**: Das Haus wurde 1990 gebaut. Perfect: **ist … worden**. **Zustandspassiv** (result) uses sein: Das Haus ist gebaut.
B: Spoken German often prefers **man**: Man spricht hier Deutsch.
E: Hier wird Deutsch gesprochen. = German is spoken here.
E: Das Haus wurde 1990 gebaut. = The house was built in 1990.
E: Der Brief wird von Anna geschrieben. = The letter is being written by Anna.
E: Man spricht hier Deutsch. = One speaks German here.
M: "Das Haus ist gebaut worden" is correct; don't drop worden.
M: Using durch/by for people — use von for persons.
M: Putting the participle in the middle: "Das Haus wird gebaut von…" — participle goes last unless von-phrase follows (both acceptable) but keep participle at the end of the clause core.

## sounds | sounds | German vowels, umlauts & ch | A1
I: German spelling is largely regular, but it has sounds English lacks: umlauts and two kinds of "ch". Long vowels are usually followed by a single consonant, short vowels by a double one.
S: ä | Like "e" in bed, but longer when stressed | Mädchen=girl, Käse=cheese
S: ö | Say "ay" with rounded lips | schön=beautiful, hören=to hear
S: ü | Say "ee" with rounded lips | über=over, müde=tired
S: ei | Like English "eye" | nein=no, Eis=ice cream
S: ie | Like "ee" in see (a long vowel) | Liebe=love, Brief=letter
S: eu / äu | Like "oy" in boy | neu=new, Häuser=houses
S: ch (after a, o, u) | Throaty, like Scottish loch | Buch=book, Nacht=night
S: ch (after e, i, ä, ö, ü) | Soft hiss, like "h" in "huge" | ich=I, Milch=milk
S: sch | Like English "sh" | Schule=school, schön=beautiful
S: z | Always "ts" | Zeit=time, zwei=two
S: w | Pronounced like English "v" | Wasser=water, wir=we
S: v | Usually like English "f" | Vater=father, viel=much
P: Bett | Beet | short vs long e (double consonant = short vowel)
P: schon | schön | o vs ö
P: Mutter | Mütter | u vs ü (singular vs plural)
D: Ich möchte ein Glas Milch, bitte.
D: Das Mädchen wohnt in der Schule neben dem Büro.
D: Wie viel Uhr ist es?
M: Saying w like English "w" (Wasser should start with a "v" sound).
M: Pronouncing ie as "eye" (Liebe is LEE-be).
M: Using one "ch" sound for everything — ich and Buch are different.
## sounds2 | sounds2 | Word stress, r, final devoicing | A1
I: German stress usually falls on the first syllable of a word, and final b, d, g are pronounced as p, t, k. The German r is made in the throat, not with the tongue tip.
S: stress | Usually on the first syllable; separable prefixes carry the stress (AN-rufen) | Arbeit, ANrufen, Bahnhof
S: r | Throaty, like a soft gargle; after a vowel it softens to "uh" | rot=red, Bruder=brother
S: final b/d/g | Devoiced: Tag sounds like "tahk", Hund like "hunt" | Tag=day, Hund=dog, Berg=mountain
S: -ig | Pronounced "ikh" at the end of a word | billig=cheap, zwanzig=twenty
S: sp / st | At the start of a word, pronounced "shp" / "sht" | sprechen=to speak, Straße=street
S: ß | A sharp "ss" after long vowels and diphthongs | heiß=hot, Straße=street
P: Rat | Rad | final d is pronounced t — they sound the same
P: Staat | Stadt | state / town (both "shtaht")
P: wider | wieder | against / again (short i vs long ie)
D: Der Hund läuft auf der Straße.
D: Ich spreche Deutsch und studiere Biologie.
D: Das Frühstück ist um acht Uhr.
M: Voicing a final d or g (Tag as "tahg").
M: Using an English r.
M: Pronouncing sp/st as "sp"/"st" at the start of a word.

R: Tense | Form | Example

R: Perfekt with sein | movement or change of state | Ich bin gegangen
R: Präteritum (sein/haben/modals) | war, hatte, konnte, musste | Es war gut
R: Participles | machen→gemacht · sehen→gesehen · gehen→gegangen · fahren→gefahren | Wir haben einen Film gesehen

R: Case | der (m) | die (f) | das (n) | die (pl)
R: Nominativ | der | die | das | die
R: Akkusativ | den | die | das | die
R: Dativ | dem | der | dem | den (+n)
R: Genitiv | des | der | des | der

R: Perfekt | auxiliary 2nd, participle last | Ich habe Fisch gegessen
R: Separable verbs | prefix goes to the end | Ich rufe dich an

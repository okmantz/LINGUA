## pronouns | pronouns | Subject pronouns & "you" | A1
S: Spanish has two ways to say "you" — and the verb ending usually shows who is acting, so pronouns are often dropped.
B: The pronouns are **yo, tú, él/ella/usted, nosotros/as, vosotros/as, ellos/ellas/ustedes**. Use **tú** with friends, family and peers; use **usted** with strangers, elders and in formal situations.
B: Latin America uses **ustedes** for every plural "you". Spain adds **vosotros/as** for informal plural. This course teaches ustedes first and shows vosotros as a recognition form.
B: Because endings carry the subject (hablo = I speak), say the pronoun only to contrast or emphasise: "Yo trabajo, pero él no."

T: 1st | yo | nosotros / nosotras
T: 2nd informal | tú | vosotros / vosotras (Spain)
T: 2nd formal | usted | ustedes
T: 3rd | él / ella | ellos / ellas
E: Soy Ana. = I'm Ana. (no pronoun needed)
E: Yo soy Ana, ¿y tú? = I'm Ana, and you?
E: ¿Usted es el señor López? = Are you Mr. López? (formal)
E: Nosotros somos amigos. = We are friends.
M: Saying "yo" in every sentence — it sounds heavy; drop it unless contrasting.
M: Using tú with an older stranger or at work with a client — switch to usted.
M: Writing "ellos" for an all-female group — use ellas.

## be-verb | be-verb | Ser and estar (to be) | A1
S: Spanish has two verbs for "to be": ser (what something IS) and estar (how or where something is).
B: Use **ser** for identity, origin, profession, nationality, time and permanent characteristics. Use **estar** for location, temporary states, feelings, and results of change. A useful memory aid: ser = "essence", estar = "state/place".

E: Ella es médica. = She is a doctor. (profession → ser)
E: Estoy en casa. = I'm at home. (location → estar)
E: Estamos cansados. = We're tired. (temporary state → estar)
E: El café está frío. = The coffee is cold (right now). 
M: "Estoy de España" — origin always uses ser: Soy de España.
M: "Soy cansado" means "I'm a tiring person"; for tiredness say Estoy cansado.
M: "Soy en casa" — location of things and people uses estar: Estoy en casa.

## articles-gender | articles-gender | Gender, articles & plurals | A1
S: Every noun is masculine or feminine; the article (el/la, un/una) must match, and plurals add -s or -es.
B: Most nouns ending in **-o** are masculine (el libro) and most ending in **-a** are feminine (la casa). Learn nouns **with their article** — "el", "la" — from day one.
B: Famous exceptions: **el día, el mapa, el problema** (masculine) and **la mano, la foto** (feminine). Feminine nouns beginning with a stressed a- take el in the singular: **el agua** (but las aguas).
B: Plurals: vowel → add **-s** (casa → casas); consonant → add **-es** (ciudad → ciudades); -z → -ces (lápiz → lápices). Definite plural: los/las; indefinite: unos/unas.

M: "el mano" — mano is feminine: la mano.

## have-verb | have-verb | Tener (to have) and hay | A1
S: Tener means "to have" and appears in many idioms where English uses "to be" (age, hunger, thirst).
B: **Tener** is irregular: tengo, tienes, tiene, tenemos, tienen. Use it for possession and for **age** (tengo 30 años), **hunger/thirst** (tengo hambre/sed), **cold/heat** (tengo frío/calor), and obligation (**tener que** + infinitive).
B: **Hay** means "there is / there are" and never changes: Hay un banco. Hay dos bancos.

E: Tengo que trabajar mañana. = I have to work tomorrow.
M: "Soy 30 años" or "Estoy 30 años" — age uses tener: Tengo 30 años.

## negation | negation | Negation | A1
S: Put no before the verb; Spanish happily uses double negatives.
B: **No + verb**: No hablo francés. With words like **nunca, nada, nadie, tampoco**, Spanish requires "no" before the verb if the negative word comes after it: **No** como **nada**. (Not "no" if the negative word comes first: **Nunca** como carne.)

M: "Yo no quiero algo" — in negatives use nada: No quiero nada.
M: Thinking double negatives cancel out — in Spanish they reinforce each other.

## questions | questions | Asking questions | A1
S: Raise your voice, or use a question word; write ¿ at the start and ? at the end.
B: Yes/no questions keep statement order — only intonation changes: ¿Hablas español? You can also invert the subject: ¿Habla Ana español?
B: Question words always carry an **accent**: **qué, quién, dónde, cuándo, cómo, por qué, cuánto, cuál**. Say the question word first, then the verb: ¿Dónde vives?

## relative | relative | Relative clauses: que, quien, donde | B2
S: Build longer sentences by attaching extra information with que, quien, donde, lo que, el cual.
B: **que** is the all-purpose relative (el libro **que** leo). **quien/quienes** for people after a preposition (la chica con **quien** hablé). **donde** for places (la ciudad **donde** vivo). **lo que** = what/that which (Lo que dices es verdad). **cuyo/a** = whose.
B: With non-existent or unknown antecedents, the verb is subjunctive: Busco un piso que **tenga** balcón.
E: El libro que leo es interesante. = The book (that) I'm reading is interesting.
E: La mujer con quien hablé es mi jefa. = The woman I spoke with is my boss.
E: Esta es la ciudad donde nací. = This is the city where I was born.
E: Lo que dices es verdad. = What you say is true.
M: Dropping the relative pronoun as in English ("el libro leo") — Spanish needs que.
M: Using "quien" without a preposition for "who" as subject — que works: la mujer que habla.
M: Forgetting the subjunctive for unknown things: busco un piso que tiene → que tenga.

## passive-se | passive-se | Passive & impersonal se | B2
S: Spanish prefers se constructions to the passive: Se habla español.
B: **Pasiva refleja**: se + verb (agrees with the thing): Se vende una casa / Se venden casas. **Impersonal se**: Aquí se come bien. **True passive**: ser + participle + por: La carta fue escrita por Ana (writing, news).
B: To keep an unknown agent out: Me robaron la cartera → La cartera fue robada / Me la robaron (more natural).
E: Aquí se habla español. = Spanish is spoken here.
E: Se venden libros usados. = Used books are sold.
E: En España se cena tarde. = In Spain people dine late.
E: La novela fue escrita por Cervantes. = The novel was written by Cervantes.
M: "Se venden una casa" — the verb agrees with the thing sold: se vende una casa.
M: Overusing ser + participle in conversation — se is more natural.
M: "Es hablado español" — Se habla español.

## sounds | sounds | Spanish vowels & the alphabet | A1
I: Spanish has only five pure vowel sounds, and they never glide like English vowels. Spelling is almost perfectly phonetic: once you know the rules you can read any word aloud.
S: a | Like "a" in father; short and open | casa=house, mano=hand
S: e | Like "e" in bed, not "ay" | mesa=table, tres=three
S: i | Like "ee" in see, but shorter | sí=yes, libro=book
S: o | Like "o" in more, without the "w" glide | no=no, hola=hello
S: u | Like "oo" in moon; silent in que/qui/gue/gui | uno=one, que=that
S: h | Always silent | hola=hello, hotel=hotel
S: j / g(e,i) | A throaty "h", like Scottish loch | jugar=to play, gente=people
S: ñ | Like "ny" in canyon | año=year, español=Spanish
S: ll / y | Like English "y" in yes (some regions "j") | llamo=I call, yo=I
P: casa | caza | s vs z are the same sound in Latin America, different in Spain (th)
P: pero | perro | single r is a tap; rr is a trill — meaning changes
P: pena | peña | n vs ñ
D: La casa de mi hermana es muy bonita.
D: Mucho gusto, me llamo Ana.
D: ¿Dónde está el hotel?
M: Pronouncing the h (hola ≠ "hola" with breath) — it's silent.
M: Diphthonging vowels like English ("no" as "noh-oo").
M: Aspirating p, t, k like English — Spanish ones are unaspirated and softer.
## sounds2 | sounds2 | Stress, r/rr & b/v | A1
I: Spanish stress is predictable: words ending in a vowel, n or s are stressed on the second-to-last syllable; others on the last. A written accent marks every exception.
S: stress rule | Ends in vowel/n/s → second-to-last syllable (HAB-la). Ends in other consonant → last (ha-BLAR). Accent mark = exception (can-CIÓN). | hablo, hablar, canción
S: r | One light tap, like "tt" in butter, between vowels and in the middle (pero) | pero=but, hora=hour
S: rr / initial r | A trill; tongue vibrates against the ridge behind the teeth | perro=dog, rápido=fast
S: b / v | Identical sounds. Hard b at the start or after a pause; soft (lips barely touch) between vowels | vaso=glass, lavar=to wash
S: d (between vowels) | Soft, like "th" in "this" | todo=all, cada=each
P: pero | perro | but / dog
P: caro | carro | expensive / car
P: hablo | habló | I speak / he spoke (stress)
D: El perro rápido corre por la calle.
D: Quiero un café con leche, por favor.
D: Mi abuelo vive en Valencia.
M: Putting stress on the wrong syllable — it changes meaning (papa potato vs papá dad).
M: Using an English r.
M: Pronouncing b and v differently.

## pronouns | pronouns | Subject pronouns, tu vs vous & on | A1
S: French has two "you"s (tu / vous), and everyday speech uses on instead of nous.
B: The subject pronouns are **je, tu, il/elle/on, nous, vous, ils/elles**. Unlike Spanish, French verbs rarely show the subject in the ending (parle / parles / parlent sound the same), so the pronoun is **required**.
B: Use **tu** with friends, family, children and peers; **vous** with strangers, elders, in formal situations — and always for more than one person. **On** (literally "one") means "we" in speech: On mange ? = Shall we eat?
B: **je** becomes **j'** before a vowel or silent h: j'habite, j'aime.

T: 1st | je (j') | nous
T: 2nd | tu (informal) / vous (formal) | vous
T: 3rd | il / elle / on | ils / elles

E: Tu habites où ? = Where do you live? (informal)
E: Vous êtes monsieur Martin ? = Are you Mr. Martin? (formal)
E: On va au cinéma ? = Shall we go to the cinema?
M: Dropping the pronoun like in Spanish: "Parle français" — you need Je parle français.
M: Using tu with a stranger or boss — use vous.
M: "Ils" for an all-female group — use elles.

## articles-gender | articles-gender | Gender, articles & plurals | A1
S: Nouns are masculine or feminine; learn each noun with its article, and make plurals with -s (silent) — the article tells you the number.
B: Definite: **le** (m), **la** (f), **l'** (before a vowel), **les** (pl). Indefinite: **un** (m), **une** (f), **des** (pl). French almost never drops the article: J'aime **le** café. (English: I like coffee.)
B: Gender clues: **-tion, -sion, -té, -ure, -ie → feminine** (la nation, la ville ends -e often f). **-ment, -age, -eau, -isme → masculine** (le gouvernement, le voyage). Plurals: add **-s**; -eau/-eu add **-x** (le bateau → les bateaux); -al → -aux (le journal → les journaux).
B: The final -s is silent, so listen to the article: **le** livre vs **les** livres. Before a vowel you hear it: **les amis** (lay-za-MEE) — this is liaison.

M: Pronouncing the plural -s — it's silent (except in liaison).

## negation | negation | Negation | A1
S: Wrap the verb with ne … pas — and note that the article becomes de after a negative.
B: **ne** (n' before a vowel) goes before the verb, **pas** after it: Je **ne** parle **pas** chinois. Other pairs: **ne … jamais** (never), **ne … rien** (nothing), **ne … personne** (nobody), **ne … plus** (no longer).
B: After a negative, **un/une/des/du/de la → de**: J'ai un frère → Je n'ai **pas de** frère. (But not after être: Ce n'est pas un chat.) In casual speech the **ne** is often dropped: Je sais pas. Use it in writing and with strangers.

S: The subjunctive follows il faut que, vouloir que and expressions of emotion or doubt, when the subject changes.
B: Formation: **ils** present stem, drop -ent, add **-e, -es, -e, -ions, -iez, -ent**: ils parlent → que je parle. Irregular: **être** (sois), **avoir** (aie), **aller** (aille), **faire** (fasse), **pouvoir** (puisse), **savoir** (sache), **vouloir** (veuille).
B: Triggers: **il faut que, vouloir que, il est important que, bien que, pour que, avant que**, emotions (je suis content que), doubt (je doute que). If the subject doesn't change, use an infinitive: Je veux **partir** / Je veux **que tu partes**.
E: Il faut que tu étudies. = You need to study.
E: Je veux que tu viennes demain. = I want you to come tomorrow.
E: Bien qu'il pleuve, nous sortons. = Although it's raining, we're going out.
E: Je suis content que tu sois là. = I'm glad you're here.
M: Using the indicative after il faut que — subjunctive: il faut que tu viennes.
M: Using the subjunctive after je pense que (affirmative) — indicative.
M: Using the subjunctive with one subject: "Je veux que je parte" → Je veux partir.

## relative | relative | Relative clauses: qui, que, où, dont | B2
S: Build longer sentences with qui (subject), que (object), où (place/time) and dont (about which).
B: **qui** replaces the subject: l'homme **qui** parle. **que** replaces the object: le livre **que** je lis. **où**: la ville **où** j'habite. **dont** replaces de + noun: le film **dont** je parle. **ce qui / ce que / ce dont** = what: Ce que tu dis est vrai.
B: Unlike English, you **cannot drop** the relative pronoun: Le livre que je lis (the book I'm reading). With avoir + participle, the participle agrees with a preceding direct object: la lettre que j'ai écrite.
E: L'homme qui parle est mon patron. = The man who is speaking is my boss.
E: Le livre que je lis est intéressant. = The book I'm reading is interesting.
E: La ville où j'habite est belle. = The city where I live is beautiful.
E: Ce que tu dis est vrai. = What you say is true.
M: Dropping que: "Le livre je lis" — Le livre que je lis.
M: Using que for the subject: "L'homme que parle" → qui.
M: Forgetting dont for verbs with de: le film dont je parle (parler de).

## passive | passive | Passive & on | B2
S: French avoids the passive in speech — use on, or a reflexive verb, instead.
B: **True passive**: être + past participle (agreeing) + par: La lettre est écrite par Marie. Common in news and formal writing. **On** replaces an unknown agent: On parle français ici. **Reflexive passive**: Ça se dit comme ça. Les livres se vendent bien.
B: Only direct-object verbs can become passive: "Il a été donné un cadeau" is not French — use On lui a donné un cadeau.
E: Ici, on parle français. = French is spoken here.
E: Les livres se vendent bien. = The books sell well.
E: La lettre a été écrite par Marie. = The letter was written by Marie.
E: On m'a volé mon sac. = My bag was stolen.
M: Overusing être + participle in conversation — on is more natural.
M: Forgetting agreement: "La lettre est écrit" → écrite.
M: Passivising indirect objects (as in English "I was given a gift") — not possible.

## sounds | sounds | French vowels, nasals & silent letters | A1
I: French spelling is irregular but rule-bound: most final consonants are silent, vowels are pure and tense, and nasal vowels (an, on, in) have no "n" sound. Stress is even, with a slight lift on the last syllable of a phrase.
S: u | Say "ee" with your lips rounded like "oo" | tu=you, rue=street
S: ou | Like "oo" in food | vous=you, jour=day
S: eu / œu | Like "uh" with rounded lips | deux=two, sœur=sister
S: nasals (an/en) | "ahn" through the nose; don't pronounce the n | enfant=child, dans=in
S: nasals (on) | "ohn" through the nose | bon=good, nous=we
S: nasals (in/ain) | "an" as in "can", through the nose | vin=wine, pain=bread
S: r | Back-of-throat "r", like a soft gargle | rouge=red, merci=thanks
S: silent letters | Final -s, -t, -d, -x, -z, -e, and -ent in verbs are mute | petit, trois, parlent
S: ch / j / g(e,i) | ch = "sh"; j and soft g = "zh" (like "measure") | chat=cat, jour=day
P: tu | tout | ü vs oo
P: rue | roue | street / wheel
P: bon | beau | nasal vs oh

## sounds2 | sounds2 | Liaison, elision & rhythm | A1
I: French flows: words link together. Elision drops a vowel before another vowel (l'ami, j'aime), and liaison pronounces a normally silent final consonant before a vowel (les amis → lay-za-MEE).
S: elision | le/la/je/de/ne/que → l'/j'/d'/n'/qu' before a vowel or silent h | l'école, j'aime, n'est
S: liaison (required) | Article + noun, pronoun + verb, adjective + noun | les amis, nous avons, un petit ami
S: liaison (forbidden) | After "et", before an h aspiré | et un, les héros
S: enchaînement | A final pronounced consonant moves to the next vowel | il est → i-LEH, elle a → eh-LAH
S: stress | Even rhythm; slightly longer on the final syllable of a group | je m'appelle ANA
S: é / è / ê | é = "ay" (closed); è ê = "eh" (open) | café, mère, fête
P: les amis | les mis | liaison turns "les" into "lez"
P: il est | il a | il-EH vs il-AH
P: dessus | dessous | on top / underneath
D: Nous avons un petit appartement à Lyon.
D: Les enfants ont envie d'un gâteau.
D: Elle est ici, il est là.
M: Stressing a syllable in the middle like English — French is evenly timed.
M: Forgetting liaison in "vous êtes", "ils ont".
M: Adding liaison after "et".

## pronouns | pronouns | Subject pronouns, du vs Sie | A1
S: German has an informal du and a formal Sie — and Sie is always capitalised.
B: **ich, du, er/sie/es, wir, ihr, sie / Sie**. Use **du** with friends, family, children and peers; **Sie** (capital S) with strangers, at work, in shops. **ihr** is the informal plural; **Sie** is both formal singular and plural.
B: **sie** (she), **sie** (they) and **Sie** (formal you) look alike — the verb and context tell them apart: sie ist (she is), sie sind (they are), Sie sind (you are, formal).

T: 1st | ich | wir
T: 2nd (informal) | du | ihr
T: 2nd (formal) | Sie | Sie
T: 3rd | er / sie / es | sie
E: Ich heiße Anna. = My name is Anna.
E: Und du? Wie heißt du? = And you? What's your name?
E: Sind Sie Herr Müller? = Are you Mr. Müller? (formal)
E: Wir sind Freunde. = We are friends.
M: Using du with an older stranger or at work — use Sie.
M: Writing "sie" for formal you — formal Sie is always capital.
M: Dropping the pronoun like Spanish — German needs it: Ich spreche Deutsch.

S: Sein is irregular and used for identity, origin, jobs, feelings and (surprisingly) age.
B: **ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind**. German says "Ich **bin** 20 Jahre alt" (I am 20 years old). Jobs normally have no article: Ich bin Arzt.
B: **Es gibt** = there is/are (see haben). Location uses **sein** too: Ich bin in Berlin.

## articles-gender | articles-gender | Gender, articles & plurals | A1
S: Every noun is der, die or das — learn each noun with its article and its plural.
B: **der** (masculine), **die** (feminine), **das** (neuter); plural **die**. Indefinite: **ein / eine / ein** (no plural). Every noun is **capitalised**: der Tisch, die Stadt.
B: Gender is largely arbitrary, but clues help: **-ung, -heit, -keit, -schaft, -tion → die**; **-er, -ling, -ismus → der**; **-chen, -lein → das**. Plurals vary: **-e** (Tisch → Tische), **-er** (Kind → Kinder), **-n/-en** (Frau → Frauen), **-s** (Auto → Autos), **umlaut** (Mutter → Mütter), or no change (Lehrer).
B: In the **accusative** (direct object) only masculine changes: der → **den**, ein → **einen**: Ich sehe den Mann.

T: the (acc.) | den | die | das | die

E: der Tisch, die Tische = the table, the tables
E: die Frau, die Frauen = the woman, the women
E: das Kind, die Kinder = the child, the children
E: Ich sehe den Mann. = I see the man.
M: "die Tisch" — Tisch is masculine: der Tisch.
M: Not capitalising nouns: "das haus" → das Haus.
M: Using der in the accusative: "Ich sehe der Mann" → den Mann.

## present-regular | present-regular | Present tense & verb position | A1
S: Drop -en and add endings; the conjugated verb is always in second position in a statement.
B: Regular endings: **-e, -st, -t, -en, -t, -en**: machen → ich mache, du machst, er macht, wir machen, ihr macht, sie machen. Stems ending in -t/-d add -e: **du arbeitest, er arbeitet**.
B: **V2 rule**: the verb is in the second slot, whatever comes first: **Heute** arbeite ich. **Ich** arbeite heute. (not "Heute ich arbeite").

## connectors-opinions | connectors-opinions | Connectors, weil & opinions | A2
S: Use und/aber/oder/denn normally; weil and dass send the verb to the end.
B: **Coordinating** (no word-order change): **und, aber, oder, denn** (because), **sondern**. **Subordinating** (verb to the end): **weil** (because), **dass** (that), **wenn** (if/when), **obwohl** (although): Ich lerne Deutsch, **weil** ich in Berlin **arbeiten möchte**. **Deshalb / deswegen** (therefore) force inversion: Deshalb **lerne ich** Deutsch.
B: Opinions: **Ich glaube, dass …, Ich denke, dass …, Meiner Meinung nach …, Ich finde …**; agreement: **Ich stimme zu / Ich bin (nicht) einverstanden / Da hast du recht**.
E: Ich lerne Deutsch, weil ich in Berlin arbeiten möchte. = I'm learning German because I want to work in Berlin.
E: Ich glaube, dass das eine gute Idee ist. = I think that it's a good idea.
E: Ich bin müde, deshalb gehe ich nach Hause. = I'm tired, so I'm going home.
E: Meiner Meinung nach ist der Zug besser. = In my opinion, the train is better.
M: "weil ich möchte arbeiten" — verb at the end: weil ich arbeiten möchte.
M: Forgetting the comma before weil/dass.
M: "Deshalb ich gehe" — verb second: deshalb gehe ich.

## cases | cases | The four cases (overview) | A2
S: German marks a noun's job in the sentence with its case: nominative, accusative, dative, genitive.
B: **Nominative** = subject (der Mann). **Accusative** = direct object (den Mann; only masculine changes). **Dative** = indirect object, after certain verbs/prepositions (dem Mann). **Genitive** = possession (des Mannes; often replaced by von in speech).
B: Prepositions fix cases: **accusative**: durch, für, gegen, ohne, um. **dative**: aus, bei, mit, nach, seit, von, zu. **two-way**: in, auf, an… (acc. = movement, dat. = location).

T: Nominative | der | die | das | die
T: Accusative | den | die | das | die
T: Dative | dem | der | dem | den (+n)
T: Genitive | des (+s) | der | des (+s) | der

## conditional | conditional | Konjunktiv II: would, could & wishes | B1
S: würde + infinitive, or hätte/wäre/könnte, expresses polite requests, advice and hypotheticals.
B: **würde + infinitive**: ich würde, du würdest, er würde, wir würden: Ich würde gern reisen. Common short forms: **hätte, wäre, könnte, müsste, sollte**. Politeness: **Könnten Sie mir helfen?** Hypotheticals: **Wenn ich Zeit hätte, würde ich reisen.** Wishes: **Ich wünschte, ich wäre dort.**

## relative | relative | Relative clauses | B1
S: Relative clauses send the verb to the end; the pronoun takes its gender and number from the noun, and its case from its job in the clause.
B: Relative pronouns look like articles (der/die/das/die) except **dative plural denen** and **genitive dessen/deren**. Always set off by commas: Der Mann, **der** dort sitzt, ist mein Chef. Das Buch, **das** ich lese, ist spannend. Die Frau, **mit der** ich spreche, ist meine Lehrerin.

## passive | passive | Passive voice | B2
S: werden + past participle (at the end) focuses on the action rather than the doer.
B: **Vorgangspassiv**: **wird/werden + Partizip II**: Das Haus **wird gebaut**. The agent appears with **von** (+ dative): Das Haus wird **von** den Arbeitern gebaut. Past: **wurde/wurden + Partizip II**: Das Haus wurde 1990 gebaut. Perfect: **ist … worden**. **Zustandspassiv** (result) uses sein: Das Haus ist gebaut.
B: Spoken German often prefers **man**: Man spricht hier Deutsch.
E: Hier wird Deutsch gesprochen. = German is spoken here.
E: Das Haus wurde 1990 gebaut. = The house was built in 1990.
E: Der Brief wird von Anna geschrieben. = The letter is being written by Anna.
E: Man spricht hier Deutsch. = One speaks German here.
M: "Das Haus ist gebaut worden" is correct; don't drop worden.
M: Using durch/by for people — use von for persons.
M: Putting the participle in the middle: "Das Haus wird gebaut von…" — participle goes last unless von-phrase follows (both acceptable) but keep participle at the end of the clause core.

R: Your name = ich heiße, ich bin ; Origin = ich komme aus ; Age = jahre alt ; A like = ich mag, ich liebe, gern ; What you do = ich arbeite, ich studiere, ich bin
M: Ich heiße Anna und komme aus Österreich. Ich bin zwanzig Jahre alt und studiere Medizin. Ich wohne mit meiner Familie in Wien. Ich lese und schwimme gern. = My name is Anna and I'm from Austria. I'm twenty and study medicine. I live in Vienna with my family. I like reading and swimming.
## w-day | w-day | Describe your day | A1 | 30
T: Describe a normal day: when you get up, what you do, and when you go to bed. Use at least three times (um ... Uhr).
R: Getting up = stehe auf ; A time = um, uhr ; Work/study = arbeite, studiere, lerne ; Eating = esse, frühstücke, mittagessen, abendessen ; Bedtime = gehe ins bett, schlafe
M: Ich stehe um sieben Uhr auf. Um acht Uhr frühstücke ich und gehe zur Arbeit. Um zwei Uhr esse ich zu Mittag und am Nachmittag lerne ich. Um neun Uhr esse ich zu Abend und um elf Uhr gehe ich ins Bett. = I get up at seven. At eight I have breakfast and go to work. At two I have lunch and in the afternoon I study. At nine I have dinner and at eleven I go to bed.
## w-message | w-message | Invite a friend | A2 | 30
T: Write a short message inviting a friend to do something this weekend. Say what, when, and where, and ask if they can come.
R: An invitation = möchtest du, kannst du, kommst du ; When = samstag, sonntag, freitag, um ; Where = ins, in, zu ; A question = ?
M: Hallo Marta, möchtest du am Samstag ins Kino gehen? Der Film beginnt um sieben Uhr. Danach können wir essen gehen. Kannst du kommen? = Hi Marta, would you like to go to the cinema on Saturday? The film starts at seven. Afterwards we can go for dinner. Can you come?
## w-plans | w-plans | Your plans | A2 | 35
T: Write about three plans for next week using werden or the present tense with a time word, and give one reason using weil.
R: Plans = werde, will, möchte ; Reason = weil ; Time words = morgen, am montag, nächste woche, heute abend ; Three activities = und, auch
M: Nächste Woche werde ich viel arbeiten. Am Samstag besuche ich meine Oma, weil ich sie vermisse. Und am Sonntag werde ich mich ausruhen. = Next week I'll work a lot. On Saturday I'll visit my grandma because I miss her. And on Sunday I'll rest.
## w-story | w-story | A short story | A2 | 45
T: Tell a short story about something that happened last weekend. Use the Perfekt and at least two connectors (zuerst, dann, danach, später).
R: Past tense = habe, bin, gegessen, gesehen, gemacht, gegangen, gewesen ; Sequence = zuerst, dann, danach, später ; A feeling = glücklich, müde, zufrieden ; A place = in, auf, im, zu
M: Am Samstag bin ich auf den Markt gegangen. Zuerst habe ich Obst gekauft und danach habe ich mit einer Freundin gegessen. Später haben wir einen Film gesehen und sind nach Hause gegangen. Ich war müde, aber glücklich. = On Saturday I went to the market. First I bought fruit and afterwards I ate with a friend. Later we watched a film and went home. I was tired but happy.

## sounds | sounds | German vowels, umlauts & ch | A1
I: German spelling is largely regular, but it has sounds English lacks: umlauts and two kinds of "ch". Long vowels are usually followed by a single consonant, short vowels by a double one.
S: ä | Like "e" in bed, but longer when stressed | Mädchen=girl, Käse=cheese
S: ö | Say "ay" with rounded lips | schön=beautiful, hören=to hear
S: ü | Say "ee" with rounded lips | über=over, müde=tired
S: ei | Like English "eye" | nein=no, Eis=ice cream
S: ie | Like "ee" in see (a long vowel) | Liebe=love, Brief=letter
S: eu / äu | Like "oy" in boy | neu=new, Häuser=houses
S: ch (after a, o, u) | Throaty, like Scottish loch | Buch=book, Nacht=night
S: ch (after e, i, ä, ö, ü) | Soft hiss, like "h" in "huge" | ich=I, Milch=milk
S: sch | Like English "sh" | Schule=school, schön=beautiful
S: z | Always "ts" | Zeit=time, zwei=two
S: w | Pronounced like English "v" | Wasser=water, wir=we
S: v | Usually like English "f" | Vater=father, viel=much
P: Bett | Beet | short vs long e (double consonant = short vowel)
P: schon | schön | o vs ö
P: Mutter | Mütter | u vs ü (singular vs plural)
D: Ich möchte ein Glas Milch, bitte.
D: Das Mädchen wohnt in der Schule neben dem Büro.
D: Wie viel Uhr ist es?
M: Saying w like English "w" (Wasser should start with a "v" sound).
M: Pronouncing ie as "eye" (Liebe is LEE-be).
M: Using one "ch" sound for everything — ich and Buch are different.
## sounds2 | sounds2 | Word stress, r, final devoicing | A1
I: German stress usually falls on the first syllable of a word, and final b, d, g are pronounced as p, t, k. The German r is made in the throat, not with the tongue tip.
S: stress | Usually on the first syllable; separable prefixes carry the stress (AN-rufen) | Arbeit, ANrufen, Bahnhof
S: r | Throaty, like a soft gargle; after a vowel it softens to "uh" | rot=red, Bruder=brother
S: final b/d/g | Devoiced: Tag sounds like "tahk", Hund like "hunt" | Tag=day, Hund=dog, Berg=mountain
S: -ig | Pronounced "ikh" at the end of a word | billig=cheap, zwanzig=twenty
S: sp / st | At the start of a word, pronounced "shp" / "sht" | sprechen=to speak, Straße=street
S: ß | A sharp "ss" after long vowels and diphthongs | heiß=hot, Straße=street
P: Rat | Rad | final d is pronounced t — they sound the same
P: Staat | Stadt | state / town (both "shtaht")
P: wider | wieder | against / again (short i vs long ie)
D: Der Hund läuft auf der Straße.
D: Ich spreche Deutsch und studiere Biologie.
D: Das Frühstück ist um acht Uhr.
M: Voicing a final d or g (Tag as "tahg").
M: Using an English r.
M: Pronouncing sp/st as "sp"/"st" at the start of a word.
